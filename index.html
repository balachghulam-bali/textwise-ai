<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextWise AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b bg-white px-4 py-3 flex justify-between items-center shadow-sm">
    <h1 class="font-bold text-xl text-indigo-600 tracking-tight">TextWise AI</h1>
    <button id="openApiKeyModal" class="px-3 py-1.5 text-sm bg-indigo-50 text-indigo-600 rounded-lg font-medium border border-indigo-200">
      🔑 API Key
    </button>
  </header>

  <!-- Main Container -->
  <main class="max-w-xl mx-auto px-4 py-6 w-full flex-grow">

    <!-- AdSense Top Banner -->
    <div class="mb-6 p-3 border border-dashed border-slate-300 rounded-xl text-center text-xs text-slate-400 bg-slate-100">
      Advertisement Space (Google AdSense Header Banner)
    </div>

    <!-- Tool Card -->
    <div class="bg-white rounded-2xl shadow-md border p-6 mb-6">
      <label class="font-semibold text-base block mb-2 text-slate-700">Paste your text below</label>
      <textarea id="inputText" rows="5" class="w-full p-3 border rounded-xl bg-slate-50 text-base mb-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Type or paste text here..."></textarea>
      <div id="charCount" class="text-xs text-slate-400 mb-4">0 characters</div>

      <label class="font-semibold text-base block mb-2 text-slate-700">Select AI Action</label>
      <select id="actionSelect" class="w-full p-3 border rounded-xl bg-slate-50 text-base mb-5 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="summarize">Summarize Key Points</option>
        <option value="grammar">Fix Grammar & Enhance Style</option>
        <option value="academic">Academic / Formal Polish</option>
        <option value="bullets">Extract Key Action Items</option>
      </select>

      <button id="generateBtn" class="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">
        Generate Output
      </button>

      <div id="outputContainer" class="hidden mt-6 pt-5 border-t">
        <h3 class="font-bold text-lg text-slate-800 mb-3">Result:</h3>
        <div id="outputText" class="p-4 bg-slate-50 border rounded-xl text-base text-slate-900 whitespace-pre-wrap leading-relaxed shadow-inner"></div>
      </div>
    </div>

    <!-- AdSense Bottom Banner -->
    <div class="p-3 border border-dashed border-slate-300 rounded-xl text-center text-xs text-slate-400 bg-slate-100">
      Advertisement Space (Google AdSense Middle Banner)
    </div>

  </main>

  <!-- API Key Modal -->
  <div id="apiKeyModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
      <h3 class="font-bold text-base mb-2 text-slate-900">Enter Gemini API Key</h3>
      <input type="password" id="apiKeyInput" placeholder="AI Studio API Key" class="w-full p-3 border rounded-xl text-base mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <div class="flex justify-end gap-2">
        <button id="closeApiKeyModal" class="px-4 py-2 text-sm text-slate-600 font-medium">Cancel</button>
        <button id="saveApiKey" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg font-semibold shadow">Save</button>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    const inputText = document.getElementById('inputText');
    const charCount = document.getElementById('charCount');
    const generateBtn = document.getElementById('generateBtn');
    const outputContainer = document.getElementById('outputContainer');
    const outputText = document.getElementById('outputText');
    const actionSelect = document.getElementById('actionSelect');
    
    const apiKeyModal = document.getElementById('apiKeyModal');
    const openApiKeyModal = document.getElementById('openApiKeyModal');
    const closeApiKeyModal = document.getElementById('closeApiKeyModal');
    const saveApiKey = document.getElementById('saveApiKey');
    const apiKeyInput = document.getElementById('apiKeyInput');

    inputText.addEventListener('input', () => {
      charCount.textContent = inputText.value.length + ' characters';
    });

    openApiKeyModal.addEventListener('click', () => {
      apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
      apiKeyModal.classList.remove('hidden');
    });

    closeApiKeyModal.addEventListener('click', () => {
      apiKeyModal.classList.add('hidden');
    });

    saveApiKey.addEventListener('click', () => {
      if (apiKeyInput.value.trim()) {
        localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        alert('API Key Saved!');
        apiKeyModal.classList.add('hidden');
      }
    });

    generateBtn.addEventListener('click', async () => {
      const text = inputText.value.trim();
      const apiKey = localStorage.getItem('gemini_api_key');

      if (!text) { alert('Please enter text!'); return; }
      if (!apiKey) { alert('Please add API Key first!'); openApiKeyModal.click(); return; }

      const action = actionSelect.value;
      let promptText = '';

      if (action === 'summarize') promptText = 'Summarize briefly in 1-2 bullet points: ' + text;
      else if (action === 'grammar') promptText = 'Provide directly only the corrected text without extra explanations: ' + text;
      else if (action === 'academic') promptText = 'Rewrite in formal academic style briefly: ' + text;
      else if (action === 'bullets') promptText = 'Extract key points in brief bullet points: ' + text;

      generateBtn.disabled = true;
      generateBtn.textContent = 'Processing...';

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        const data = await res.json();
        if (data.error) {
          alert('Error: ' + data.error.message);
        } else {
          outputText.textContent = data.candidates[0].content.parts[0].text;
          outputContainer.classList.remove('hidden');
        }
      } catch (err) {
        alert('Failed: ' + err.message);
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate Output';
      }
    });
  </script>
</body>
</html>
