<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextWise AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b bg-white px-4 py-3 flex justify-between items-center">
    <h1 class="font-bold text-lg text-indigo-600">TextWise AI</h1>
    <button id="openApiKeyModal" class="px-3 py-1 text-sm bg-indigo-50 text-indigo-600 rounded-lg font-medium border border-indigo-200">
      API Key
    </button>
  </header>

  <!-- Main -->
  <main class="max-w-xl mx-auto px-4 py-8 w-full flex-grow">
    <div class="bg-white rounded-2xl shadow-md border p-6">
      <label class="font-semibold text-sm block mb-2">Paste your text below</label>
      <textarea id="inputText" rows="5" class="w-full p-3 border rounded-xl bg-slate-50 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Type or paste text here..."></textarea>
      <div id="charCount" class="text-xs text-slate-400 mb-4">0 characters</div>

      <select id="actionSelect" class="w-full p-3 border rounded-xl bg-slate-50 text-sm mb-4">
        <option value="summarize">Summarize Key Points</option>
        <option value="grammar">Fix Grammar</option>
      </select>

      <button id="generateBtn" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-semibold shadow hover:bg-indigo-700">
        Generate Output
      </button>

      <div id="outputContainer" class="hidden mt-6 pt-4 border-t">
        <h3 class="font-semibold text-sm mb-2">Result:</h3>
        <div id="outputText" class="p-3 bg-slate-50 border rounded-xl text-sm whitespace-pre-wrap"></div>
      </div>
    </div>
  </main>

  <!-- API Key Modal -->
  <div id="apiKeyModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl">
      <h3 class="font-bold text-base mb-2">Enter Gemini API Key</h3>
      <input type="password" id="apiKeyInput" placeholder="AI Studio API Key" class="w-full p-3 border rounded-xl text-sm mb-4">
      <div class="flex justify-end gap-2">
        <button id="closeApiKeyModal" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
        <button id="saveApiKey" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg">Save</button>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    const inputText = document.getElementById('inputText');
    const charCount = document.getElementById('charCount');
    const generateBtn = document.getElementById('generateBtn');
    const outputContainer = document.getElementById('outputContainer');
    const outputText = document.getElementById('outputText');
    const actionSelect = document.getElementById('actionSelect');
    
    const apiKeyModal = document.getElementById('apiKeyModal');
    const openApiKeyModal = document.getElementById('openApiKeyModal');
    const closeApiKeyModal = document.getElementById('closeApiKeyModal');
    const saveApiKey = document.getElementById('saveApiKey');
    const apiKeyInput = document.getElementById('apiKeyInput');

    inputText.addEventListener('input', () => {
      charCount.textContent = inputText.value.length + ' characters';
    });

    openApiKeyModal.addEventListener('click', () => {
      apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
      apiKeyModal.classList.remove('hidden');
    });

    closeApiKeyModal.addEventListener('click', () => {
      apiKeyModal.classList.add('hidden');
    });

    saveApiKey.addEventListener('click', () => {
      if (apiKeyInput.value.trim()) {
        localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
        alert('API Key Saved!');
        apiKeyModal.classList.add('hidden');
      }
    });

    generateBtn.addEventListener('click', async () => {
      const text = inputText.value.trim();
      const apiKey = localStorage.getItem('gemini_api_key');

      if (!text) { alert('Please enter text!'); return; }
      if (!apiKey) { alert('Please add API Key first!'); openApiKeyModal.click(); return; }

      generateBtn.textContent = 'Processing...';

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: actionSelect.value === 'summarize' ? 'Summarize: ' + text : 'Fix grammar: ' + text }] }]
          })
        });

        const data = await res.json();
        if (data.error) {
          alert('Error: ' + data.error.message);
        } else {
          outputText.textContent = data.candidates[0].content.parts[0].text;
          outputContainer.classList.remove('hidden');
        }
      } catch (err) {
        alert('Failed: ' + err.message);
      } finally {
        generateBtn.textContent = 'Generate Output';
      }
    });
  </script>
</body>
</html>
